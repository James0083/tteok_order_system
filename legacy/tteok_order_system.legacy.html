<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>떡 주문 관리</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap');

:root{
  --paper:#F5EFE1;
  --paper-2:#EBE1CA;
  --ink:#2A2118;
  --ink-soft:#6E624F;
  --red:#C1401F;
  --red-deep:#8F2C15;
  --jade:#3C6753;
  --jade-deep:#274A3B;
  --gold:#AD7F27;
  --line:#DED0B4;
  --white:#FFFDF8;
  --danger:#B23A3A;
  --danger-bg:#F6E3DF;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Noto Sans KR',sans-serif;
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:'Noto Serif KR',serif; margin:0; color:var(--ink);}
p{margin:0;}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit; font-size:15px; color:var(--ink); background:var(--white); border:1px solid var(--line); border-radius:4px; padding:8px 9px;}
input:disabled, select:disabled{background:var(--paper-2); color:var(--ink-soft); cursor:not-allowed;}
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible{outline:2px solid var(--jade); outline-offset:1px;}
.tabular{font-variant-numeric:tabular-nums;}
.muted{color:var(--ink-soft);}
.hidden{display:none !important;}

/* ---------- layout shell ---------- */
#app{min-height:100vh; display:flex; flex-direction:column;}
.site-header{background:var(--white); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:20;}
.brand-row{max-width:1200px; margin:0 auto; padding:14px 18px 0; display:flex; align-items:center; gap:12px;}
.brand-mark{font-family:'Noto Serif KR',serif; font-weight:700; font-size:26px; color:var(--red); border:2px solid var(--red); border-radius:4px; width:42px; height:42px; display:flex; align-items:center; justify-content:center; flex:none;}
.brand-text h1{font-size:19px; font-weight:700;}
.brand-text p{font-size:12.5px; color:var(--ink-soft); margin-top:2px;}
.tabs{max-width:1200px; margin:0 auto; padding:12px 18px 0; display:flex; gap:4px; flex-wrap:wrap;}
.tab-btn{background:none; border:none; border-bottom:2px solid transparent; padding:10px 6px; font-size:14.5px; font-weight:500; color:var(--ink-soft); margin-right:14px;}
.tab-btn.active{color:var(--red); border-bottom-color:var(--red); font-weight:700;}
main{flex:1; width:100%;}
.wrap{max-width:820px; margin:0 auto; padding:20px 16px 120px;}
.wrap-wide{max-width:1200px; margin:0 auto; padding:20px 16px 80px;}

.panel{background:var(--white); border:1px solid var(--line); border-radius:6px; padding:16px; margin-bottom:16px;}
.panel h2{font-size:16px; margin-bottom:4px;}
.panel .panel-sub{font-size:12.5px; color:var(--ink-soft); margin-bottom:12px;}

.field-row{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:10px;}
.field{flex:1; min-width:150px; display:flex; flex-direction:column; gap:4px;}
.field label{font-size:12.5px; font-weight:700; color:var(--ink-soft);}
.field input, .field select, .field textarea{width:100%;}
.field textarea{resize:vertical; min-height:60px;}
.req::after{content:' *'; color:var(--red);}

.notice{font-size:12.5px; padding:9px 11px; border-radius:4px; margin-top:6px; line-height:1.5;}
.notice-warn{background:#FBF0DD; color:#7A5A16; border:1px solid #E9CE95;}
.notice-info{background:var(--paper-2); color:var(--ink-soft);}
.notice-error{background:var(--danger-bg); color:var(--danger); border:1px solid #E3B7AF;}
.notice-ok{background:var(--paper-2)color:var(--jade-deep);background:#E4EEE8; color:var(--jade-deep); border:1px solid #BFDBCB;}

/* ---------- receive method ---------- */
.method-choice{display:flex; gap:10px; margin-bottom:6px;}
.method-btn{flex:1; padding:12px 10px; border:1px solid var(--line); border-radius:6px; background:var(--white); text-align:center; font-weight:700; font-size:14px; color:var(--ink-soft);}
.method-btn.active{border-color:var(--red); color:var(--red); background:#FBEEE9;}

/* ---------- item picker ---------- */
.picker-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:10px;}
@media (max-width:680px){ .picker-grid{grid-template-columns:1fr 1fr;} }
.picker-grid .field label{white-space:nowrap;}
.fixed-note{font-size:12.5px; color:var(--jade-deep); background:var(--ok-bg,#E4EEE8); border-radius:4px; padding:8px 9px; line-height:1.4;}
.cart-list{border:1px solid var(--line); border-radius:6px; overflow:hidden; margin-top:14px;}
.cart-line{display:flex; align-items:center; gap:10px; padding:9px 12px; border-bottom:1px solid var(--line); background:var(--white); font-size:14px;}
.cart-line:last-child{border-bottom:none;}
.cl-main{flex:1;}
.cl-sub{font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap;}

/* ---------- ritual items ---------- */
.rlist{border:1px solid var(--line); border-radius:6px; overflow:hidden;}
.rrow{display:flex; flex-wrap:wrap; align-items:center; gap:8px 16px; padding:9px 10px; border-bottom:1px solid var(--line); font-size:14px; background:var(--white);}
.rrow:last-child{border-bottom:none;}
.rrow .rname{flex:1; min-width:150px; font-weight:500;}
.rrow .rprice{color:var(--ink-soft); font-size:12.5px; width:110px;}
.rrow .rsub{width:90px; text-align:right; font-weight:700; font-size:13.5px;}
.stepper{display:inline-flex; align-items:center; border:1px solid var(--line); border-radius:4px; overflow:hidden; background:var(--white);}
.stepper button{width:25px; height:27px; border:none; background:var(--paper-2); font-size:15px; line-height:1; color:var(--ink);}
.stepper button:active{background:var(--line);}
.stepper input{width:36px; border:none; text-align:center; padding:0; -moz-appearance:textfield;}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none; margin:0;}

/* ---------- summary / footer bar ---------- */
.total-bar{position:sticky; bottom:0; left:0; right:0; background:var(--white); border-top:1px solid var(--line); box-shadow:0 -2px 10px rgba(0,0,0,.05); padding:12px 16px; z-index:15;}
.total-bar-inner{max-width:820px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;}
.total-amt{font-size:20px; font-weight:700; color:var(--red);}
.total-amt .lbl{font-size:12.5px; color:var(--ink-soft); font-weight:500; display:block; margin-bottom:2px;}
.surcharge-line{font-size:12px; color:var(--ink-soft); margin-top:2px;}

.btn{border:1px solid var(--ink); background:var(--ink); color:var(--white); padding:11px 20px; border-radius:4px; font-size:14.5px; font-weight:700;}
.btn-primary{background:var(--red); border-color:var(--red);}
.btn-primary:disabled{opacity:.5; cursor:not-allowed;}
.btn-outline{background:var(--white); color:var(--ink); border:1px solid var(--line); font-weight:500;}
.btn-jade{background:var(--jade); border-color:var(--jade);}
.btn-danger{background:var(--white); color:var(--danger); border:1px solid var(--danger);}
.btn-sm{padding:6px 11px; font-size:12.5px; border-radius:4px;}
.link-btn{background:none; border:none; color:var(--ink-soft); text-decoration:underline; font-size:12.5px; padding:4px 0;}

.edit-banner{background:#FBF0DD; border:1px solid #E9CE95; color:#7A5A16; border-radius:6px; padding:10px 14px; margin-bottom:14px; display:flex; align-items:center; justify-content:space-between; gap:10px; font-size:13.5px;}

/* ---------- confirmation ---------- */
.confirm-box{text-align:center; padding:36px 18px;}
.confirm-mark{font-size:40px; color:var(--jade); margin-bottom:10px;}
.confirm-box h2{font-size:20px; margin-bottom:6px;}
.confirm-id{letter-spacing:.03em; color:var(--gold); font-weight:700; margin:8px 0 18px;}
.confirm-summary{text-align:left; max-width:420px; margin:0 auto 20px; background:var(--paper-2); border-radius:6px; padding:14px 16px; font-size:13.5px;}
.confirm-summary div{display:flex; justify-content:space-between; padding:3px 0; gap:10px;}

/* ---------- lookup ---------- */
.order-card{border:1px solid var(--line); border-radius:6px; padding:13px 15px; margin-bottom:10px; background:var(--white);}
.order-card-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:8px;}
.order-card-top .oid{font-size:11.5px; color:var(--ink-soft);}
.order-card-top .odate{font-weight:700; font-size:14.5px;}
.badge{display:inline-block; padding:3px 9px; border-radius:20px; font-size:11.5px; font-weight:700;}
.badge-접수{background:#F4E9CE; color:#8A6A16;}
.badge-생산중{background:#DCE8E1; color:var(--jade-deep);}
.badge-완료{background:var(--jade); color:#fff;}
.badge-취소{background:#EEE; color:#888; text-decoration:line-through;}
.order-items-sum{font-size:13px; color:var(--ink-soft); margin-bottom:8px; line-height:1.6;}
.order-card-bottom{display:flex; justify-content:space-between; align-items:center; gap:10px;}
.order-amt{font-weight:700; font-size:15px;}
.card-actions{display:flex; gap:6px;}

/* ---------- admin / monitor ---------- */
.pin-box{max-width:340px; margin:60px auto; text-align:center;}
.pin-box .brand-mark{margin:0 auto 14px;}
.pin-box input{text-align:center; letter-spacing:.3em; font-size:18px;}
.date-nav{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:16px;}
.date-nav .dtitle{font-size:16px; font-weight:700; font-family:'Noto Serif KR',serif;}
.stat-cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:16px;}
.stat-card{background:var(--white); border:1px solid var(--line); border-radius:6px; padding:12px 14px;}
.stat-card .slbl{font-size:12px; color:var(--ink-soft); margin-bottom:4px;}
.stat-card .sval{font-size:20px; font-weight:700;}
.table-scroll{overflow-x:auto; border:1px solid var(--line); border-radius:6px;}
table.dtab{width:100%; border-collapse:collapse; font-size:13.5px; min-width:520px;}
table.dtab th{background:var(--paper-2); text-align:left; padding:8px 10px; font-size:11.5px; color:var(--ink-soft); font-weight:700; border-bottom:1px solid var(--line); white-space:nowrap;}
table.dtab td{padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top;}
table.dtab tr:last-child td{border-bottom:none;}
table.dtab td.num{text-align:right;}
.status-select{font-size:12.5px; padding:5px 6px;}
.trend-row{display:flex; align-items:center; gap:10px; padding:6px 0; font-size:13px;}
.trend-date{width:96px; flex:none; color:var(--ink-soft);}
.trend-bar-track{flex:1; background:var(--paper-2); border-radius:3px; height:10px; overflow:hidden;}
.trend-bar-fill{height:100%; background:var(--jade);}
.trend-val{width:150px; flex:none; text-align:right; font-weight:600;}
.empty-state{padding:30px 16px; text-align:center; color:var(--ink-soft); font-size:13.5px;}

.settings-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
@media (max-width:820px){ .settings-grid{grid-template-columns:1fr;} }
.store-row{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 10px; border-bottom:1px solid var(--line); font-size:13.5px;}
.store-row:last-child{border-bottom:none;}
.store-list{border:1px solid var(--line); border-radius:6px; overflow:hidden; margin-bottom:12px;}

footer.contact-foot{max-width:820px; margin:0 auto; padding:0 16px 30px; font-size:12px; color:var(--ink-soft); text-align:center;}

/* ---------- print ---------- */
@media print{
  .no-print{display:none !important;}
  body{background:#fff;}
  .wrap-wide{max-width:100%; padding:0;}
  .panel{border:1px solid #999; box-shadow:none;}
  table.dtab{min-width:0;}
  table.dtab th{background:#eee !important; -webkit-print-color-adjust:exact; print-color-adjust:exact;}
}
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
'use strict';

/* ============================================================
   기본값 — 최초 1회만 사용되며, 이후 관리자 설정 화면에서 바꾸면
   공유 저장소에 저장되어 그 값이 계속 사용됩니다.
   ============================================================ */
var DEFAULT_ADMIN_PIN = '0207';
var DEFAULT_STAFF_PIN = '1111';
var CONTACT = { phone1:'031-774-2452', phone2:'010-9023-2452', hours:'9:30 ~ 15:00' };

var ORDERS_KEY = 'tteok-orders-v2';
var CONFIG_KEY = 'tteok-config-v2';
var STORES_KEY = 'tteok-stores-v2';

/* ============================================================
   상품 데이터 (2026.08 가격표 기준)
   ============================================================ */
var PRODUCTS = [
  {no:1,  id:1,  name:'가래떡',              mal:60000,  half:30000},
  {no:2,  id:2,  name:'떡국떡',              mal:70000,  half:35000},
  {no:3,  id:3,  name:'떡볶이떡',            mal:60000,  half:30000},
  {no:4,  id:4,  name:'혼합절편',            mal:70000,  half:35000},
  {no:5,  id:5,  name:'약식',                mal:120000, half:60000, note:'1말 낱개 120개로 제공됩니다.'},
  {no:6,  id:6,  name:'바람떡',              mal:100000, half:50000},
  {no:7,  id:7,  name:'꿀떡',                mal:100000, half:50000},
  {no:8,  id:8,  name:'고사떡(메시루 7:3)',  mal:110000, half:60000},
  {no:9,  id:9,  name:'찰고사떡(찰시루떡)',  mal:120000, half:65000},
  {no:10, id:10, name:'흑임자인절미',        mal:130000, half:65000},
  {no:11, id:11, name:'호박/흑미/흰 영양찰떡', mal:120000, half:60000, note:'1말 낱개 120개로 제공됩니다.'},
  {no:12, id:12, name:'동부인절미(흰/쑥)',   mal:120000, half:60000},
  {no:13, id:13, name:'콩가루인절미(흰/쑥)', mal:120000, half:60000},
  {no:14, id:14, name:'수수팥단지',          mal:130000, half:65000},
  {no:15, id:15, name:'동부편',              mal:110000, half:60000},
  {no:16, id:16, name:'콩시루편',            mal:110000, half:60000},
  {no:17, id:17, name:'쑥개떡',              mal:120000, half:60000},
  {no:18, id:18, name:'송편(모시,깨,동부)',  mal:120000, half:60000},
  {no:19, id:19, name:'무지개떡',            mal:100000, half:50000, cutSelect:true},
  {no:20, id:20, name:'콩설기',              mal:100000, half:50000, cutSelect:true},
  {no:21, id:21, name:'모찌떡',              mal:130000, half:65000},
  {no:22, id:22, name:'백설기',              mal:80000,  half:40000, cutSelect:true},
  {no:23, id:23, name:'수리취찰떡',          mal:130000, half:65000},
  {no:24, id:24, name:'증편',                mal:120000, half:60000},
  {no:25, id:25, name:'마구설기',            mal:100000, half:50000, cutSelect:true},
  {no:26, id:26, name:'밥알쑥찰떡',          mal:120000, half:60000, note:'1말 낱개 120개로 제공됩니다.'},
  {no:27, id:27, name:'찐밥',                mal:80000,  half:null},
  {no:28, id:28, name:'오곡밥',              mal:120000, half:null},
];

var RITUAL_ITEMS = [
  {id:'r1', name:'동부편(제사용 3쪽)',       price:12000},
  {id:'r2', name:'콩시루편(제사용 3쪽)',     price:12000},
  {id:'r3', name:'동부인절미편(제사용 3쪽)', price:15000},
  {id:'r4', name:'콩인절미편(제사용 3쪽)',   price:15000},
];

var CUT_OPTIONS = ['40쪽','50쪽','60쪽'];

/* 절편(혼합절편)·바람떡·쑥개떡만 주문 시 1말 기준 10,000원 자동 추가 */
var SURCHARGE_ELIGIBLE_IDS = [4,6,17];
var SURCHARGE_PER_MAL = 10000;

/* ============================================================
   유틸
   ============================================================ */
function fmtWon(n){ return (n||0).toLocaleString('ko-KR') + '원'; }
function pad2(n){ return String(n).padStart(2,'0'); }
function fmtDate(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function todayStr(){ return fmtDate(new Date()); }
function addDays(dateStr, n){
  var p = dateStr.split('-').map(Number);
  var dt = new Date(p[0], p[1]-1, p[2]);
  dt.setDate(dt.getDate()+n);
  return fmtDate(dt);
}
function fmtDateLong(dateStr){
  var p = dateStr.split('-').map(Number);
  var dt = new Date(p[0], p[1]-1, p[2]);
  var days = ['일','월','화','수','목','금','토'];
  return p[0]+'년 '+p[1]+'월 '+p[2]+'일 ('+days[dt.getDay()]+')';
}
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function genId(prefix){
  return (prefix||'ID') + Date.now().toString(36).toUpperCase() + Math.random().toString(36).slice(2,5).toUpperCase();
}
function val(sel){
  var elx = document.querySelector(sel);
  return elx ? elx.value : '';
}
function findProduct(id){
  for (var i=0;i<PRODUCTS.length;i++){ if (PRODUCTS[i].id===id) return PRODUCTS[i]; }
  return null;
}
function findRitual(id){
  for (var i=0;i<RITUAL_ITEMS.length;i++){ if (RITUAL_ITEMS[i].id===id) return RITUAL_ITEMS[i]; }
  return null;
}
function formatMal(n){
  var r = Math.round(n*10)/10;
  return r + '말';
}
function receiveMethodLabel(order){
  if (order.receiveMethod==='store'){ return '매장수령 · ' + (order.storeName||'미지정'); }
  if (order.receiveMethod==='delivery'){
    var addr = order.address||'';
    return '배송 · ' + (addr.length>22 ? addr.slice(0,22)+'…' : addr);
  }
  return '-';
}
function shortId(id){ return id ? id.slice(-8) : ''; }

/* ============================================================
   저장소 (Claude 아티팩트 공유 저장소, shared=true)
   window.storage 를 사용할 수 없는 환경에서는 메모리로만 동작합니다.
   ============================================================ */
var hasStorage = (typeof window.storage !== 'undefined' && window.storage);
var memoryOrders = [];
var memoryConfig = { adminPin:DEFAULT_ADMIN_PIN, staffPin:DEFAULT_STAFF_PIN };
var memoryStores = [];

function loadOrders(){
  if (!hasStorage){ return Promise.resolve(memoryOrders.slice()); }
  return window.storage.get(ORDERS_KEY, true).then(function(res){
    if (res && res.value){ try { return JSON.parse(res.value); } catch(e){ return []; } }
    return [];
  }).catch(function(){ return []; });
}
function saveOrders(orders){
  if (!hasStorage){ memoryOrders = orders; return Promise.resolve(true); }
  return window.storage.set(ORDERS_KEY, JSON.stringify(orders), true).then(function(){ return true; }).catch(function(e){ console.error('save failed', e); return false; });
}
function mutateOrders(fn){
  return loadOrders().then(function(current){
    var updated = fn(current);
    return saveOrders(updated).then(function(ok){ state.orders = updated; return ok; });
  });
}

function loadConfig(){
  if (!hasStorage){ return Promise.resolve(Object.assign({}, memoryConfig)); }
  return window.storage.get(CONFIG_KEY, true).then(function(res){
    if (res && res.value){
      try { return Object.assign({adminPin:DEFAULT_ADMIN_PIN, staffPin:DEFAULT_STAFF_PIN}, JSON.parse(res.value)); } catch(e){ return {adminPin:DEFAULT_ADMIN_PIN, staffPin:DEFAULT_STAFF_PIN}; }
    }
    return {adminPin:DEFAULT_ADMIN_PIN, staffPin:DEFAULT_STAFF_PIN};
  }).catch(function(){ return {adminPin:DEFAULT_ADMIN_PIN, staffPin:DEFAULT_STAFF_PIN}; });
}
function saveConfig(cfg){
  if (!hasStorage){ memoryConfig = cfg; return Promise.resolve(true); }
  return window.storage.set(CONFIG_KEY, JSON.stringify(cfg), true).then(function(){ return true; }).catch(function(){ return false; });
}

function loadStores(){
  if (!hasStorage){ return Promise.resolve(memoryStores.slice()); }
  return window.storage.get(STORES_KEY, true).then(function(res){
    if (res && res.value){ try { return JSON.parse(res.value); } catch(e){ return []; } }
    return [];
  }).catch(function(){ return []; });
}
function saveStores(stores){
  if (!hasStorage){ memoryStores = stores; return Promise.resolve(true); }
  return window.storage.set(STORES_KEY, JSON.stringify(stores), true).then(function(){ return true; }).catch(function(){ return false; });
}
function mutateStores(fn){
  return loadStores().then(function(current){
    var updated = fn(current);
    return saveStores(updated).then(function(ok){ state.stores = updated; return ok; });
  });

/* ============================================================
   가격 계산
   ============================================================ */
function unitPriceOf(product, unit){ return unit==='mal' ? product.mal : product.half; }

function computeSurcharge(items){
  if (!items.length) return {applies:false, units:0, amount:0};
  var allEligible = items.every(function(i){ return SURCHARGE_ELIGIBLE_IDS.indexOf(i.productId) > -1; });
  if (!allEligible) return {applies:false, units:0, amount:0};
  var units = items.reduce(function(s,i){ return s + (i.unit==='mal' ? i.qty : i.qty*0.5); },0);
  return {applies:true, units:units, amount: Math.round(units*SURCHARGE_PER_MAL)};
}

function collectOrderFromDraft(){
  var items = state.draft.items.map(function(line){
    var p = findProduct(line.productId);
    var price = unitPriceOf(p, line.unit);
    return {
      productId:p.id, no:p.no, name:p.name, unit:line.unit, qty:line.qty, cut:line.cut||null,
      lineTotal: price*line.qty
    };
  });
  var ritual = [];
  state.draft.ritual.forEach(function(r){
    if ((r.sets||0) > 0){
      var def = findRitual(r.id);
      ritual.push({ id:def.id, name:def.name, sets:r.sets, unitPrice:def.price, lineTotal:r.sets*def.price });
    }
  });
  var itemsTotal = items.reduce(function(s,i){return s+i.lineTotal;},0) + ritual.reduce(function(s,i){return s+i.lineTotal;},0);
  var surcharge = computeSurcharge(items);
  return { items:items, ritual:ritual, itemsTotal:itemsTotal, surcharge:surcharge, total: itemsTotal + surcharge.amount };
}

/* ---------- 생산분 요약 (말/1·2말을 합산 표기, 금액 없음) ---------- */
function renderProductionSummary(orders){
  var totals = {};
  orders.forEach(function(o){
    o.items.forEach(function(i){
      if (!totals[i.productId]) totals[i.productId] = {malEq:0, cuts:{}};
      var eq = i.unit==='mal' ? i.qty : i.qty*0.5;
      totals[i.productId].malEq += eq;
      if (i.cut){ totals[i.productId].cuts[i.cut] = (totals[i.productId].cuts[i.cut]||0)+1; }
    });
  });
  var rows = PRODUCTS.filter(function(p){ return totals[p.id]; }).map(function(p){
    var t = totals[p.id];
    var kg = Math.round(t.malEq*10*10)/10;
    var cutNote = Object.keys(t.cuts).length ? Object.keys(t.cuts).map(function(k){ return k+' x'+t.cuts[k]; }).join(', ') : '';
    return '<tr><td>'+p.no+'</td><td>'+esc(p.name)+(cutNote?('<br><small class="muted">'+esc(cutNote)+'</small>'):'')+'</td>' +
      '<td class="num tabular">'+formatMal(t.malEq)+'</td><td class="num tabular">'+kg+'kg</td></tr>';
  }).join('');

  var out = '';
  if (!rows){
    out += '<div class="empty-state">이 날짜에 접수된 떡 주문이 없습니다.</div>';
  } else {
    out += '<div class="table-scroll"><table class="dtab">';
    out += '<thead><tr><th>No</th><th>품목</th><th>수량</th><th>중량</th></tr></thead>';
    out += '<tbody>'+rows+'</tbody></table></div>';
  }

  var ritualTotals = {};
  orders.forEach(function(o){
    o.ritual.forEach(function(r){
      if (!ritualTotals[r.id]) ritualTotals[r.id] = {sets:0, name:r.name};
      ritualTotals[r.id].sets += r.sets;
    });
  });
  var ritualKeys = Object.keys(ritualTotals);
  if (ritualKeys.length){
    var rRows = ritualKeys.map(function(k){
      var t = ritualTotals[k];
      return '<tr><td>'+esc(t.name)+'</td><td class="num tabular">'+t.sets+'세트</td><td class="num tabular">'+(t.sets*3)+'쪽</td></tr>';
    }).join('');
    out += '<h3 style="font-size:13.5px; margin:14px 0 6px;">제사용 편</h3>';
    out += '<div class="table-scroll"><table class="dtab"><thead><tr><th>품목</th><th>세트</th><th>쪽수</th></tr></thead><tbody>'+rRows+'</tbody></table></div>';
  }

  var surchargeCount = orders.filter(function(o){ return o.surchargeApplies; }).length;
  if (surchargeCount>0){
    out += '<div class="notice notice-warn" style="margin-top:10px;">절편·바람떡·쑥개떡 단독 추가요금 적용 주문 '+surchargeCount+'건 포함</div>';
  }
  return out;
}

function renderOrderStatusTable(orders, adminMode){
  if (!orders.length){ return '<div class="empty-state">이 날짜에 접수된 주문이 없습니다.</div>'; }
  var rows = orders.map(function(o){
    var statusOptions = ['접수','생산중','완료','취소'].map(function(s){
      return '<option value="'+s+'" '+(o.status===s?'selected':'')+'>'+s+'</option>';
    }).join('');
    var actionsCell = '';
    if (adminMode){
      var confirming = state.admin.deleteConfirmId===o.id;
      if (confirming){
        actionsCell = '<span style="font-size:12px;">정말 삭제할까요? </span>' +
          '<button class="btn btn-danger btn-sm no-print" data-action="admin-delete-confirm" data-id="'+o.id+'">삭제 확정</button> ' +
          '<button class="btn btn-outline btn-sm no-print" data-action="admin-delete-cancel">취소</button>';
      } else {
        actionsCell = '<button class="btn btn-outline btn-sm no-print" data-action="edit-order" data-id="'+o.id+'" data-return="admin">수정</button> ' +
          '<button class="btn btn-danger btn-sm no-print" data-action="admin-delete" data-id="'+o.id+'">삭제</button>';
      }
    }
    return '<tr>' +
      '<td class="muted">#'+esc(shortId(o.id))+'</td>' +
      '<td>'+esc(o.phone)+'<br><span class="muted" style="font-size:11.5px;">'+esc(receiveMethodLabel(o))+'</span></td>' +
      '<td style="max-width:260px;">'+esc(orderItemsSummary(o))+(o.memo?('<br><span class="muted" style="font-size:11.5px;">메모: '+esc(o.memo)+'</span>'):'')+'</td>' +
      (adminMode ? '<td class="num tabular">'+fmtWon(o.total)+'</td>' : '') +
      '<td><select class="status-select" data-action-select="status" data-id="'+o.id+'">'+statusOptions+'</select></td>' +
      (adminMode ? '<td>'+actionsCell+'</td>' : '') +
    '</tr>';
  }).join('');
  var head = '<tr><th>번호</th><th>연락처/수령</th><th>주문 내역</th>' + (adminMode?'<th>금액</th>':'') + '<th>상태</th>' + (adminMode?'<th class="no-print">관리</th>':'') + '</tr>';
  return '<div class="table-scroll"><table class="dtab"><thead>'+head+'</thead><tbody>'+rows+'</tbody></table></div>';
}

function renderTrend(){
  var byDate = {};
  state.orders.forEach(function(o){
    if (o.status==='취소') return;
    if (!byDate[o.deliveryDate]) byDate[o.deliveryDate] = {count:0, revenue:0};
    byDate[o.deliveryDate].count++;
    byDate[o.deliveryDate].revenue += o.total;
  });
  var dates = Object.keys(byDate).sort().reverse().slice(0,14);
  if (!dates.length){ return '<div class="empty-state">아직 통계를 표시할 주문 데이터가 없습니다.</div>'; }
  var max = Math.max.apply(null, dates.map(function(d){ return byDate[d].revenue; }));
  return dates.map(function(d){
    var t = byDate[d];
    var pct = max>0 ? Math.round(t.revenue/max*100) : 0;
    return '<div class="trend-row">' +
      '<div class="trend-date">'+d+'</div>' +
      '<div class="trend-bar-track"><div class="trend-bar-fill" style="width:'+pct+'%;"></div></div>' +
      '<div class="trend-val tabular">'+t.count+'건 · '+fmtWon(t.revenue)+'</div>' +
    '</div>';
  }).join('');
}

/* ============================================================
   주문/수정 제출
   ============================================================ */
function buildOrderPayload(){
  var phone = val('#f-phone').trim();
  var deliveryDate = val('#f-date');
  var memo = val('#f-memo').trim();
  var receiveMethod = state.formFields.receiveMethod;
  var storeName = receiveMethod==='store' ? (val('#f-store-search')||'').trim() : '';
  var address = receiveMethod==='delivery' ? (val('#f-address')||'').trim() : '';
  state.formFields = { phone:phone, date:deliveryDate, memo:memo, receiveMethod:receiveMethod, storeName:storeName, address:address };

  var totals = collectOrderFromDraft();

  if (!phone || phone.replace(/[^0-9]/g,'').length < 9){ return {error:'연락처를 정확히 입력해주세요.'}; }
  if (!deliveryDate){ return {error:'수령(배송) 희망일을 선택해주세요.'}; }
  if (deliveryDate < addDays(todayStr(),1)){ return {error:'수령 희망일은 내일 이후로 선택해주세요.'}; }
  if (!receiveMethod){ return {error:'수령 방법(매장 수령/집으로 배송)을 선택해주세요.'}; }
  if (receiveMethod==='store'){
    var storeOk = state.stores.some(function(s){ return s.name===storeName; });
    if (!storeName || !storeOk){ return {error:'목록에 있는 매장을 검색해 선택해주세요.'}; }
  }
  if (receiveMethod==='delivery' && !address){ return {error:'배송 받으실 주소를 입력해주세요.'}; }
  if (totals.items.length===0 && totals.ritual.length===0){ return {error:'주문할 떡을 1개 이상 담아주세요.'}; }

  return { payload:{
    phone:phone, deliveryDate:deliveryDate, memo:memo,
    receiveMethod:receiveMethod, storeName: receiveMethod==='store'?storeName:null, address: receiveMethod==='delivery'?address:null,
    items:totals.items, ritual:totals.ritual, itemsTotal:totals.itemsTotal,
    surchargeApplies:totals.surcharge.applies, surchargeUnits:totals.surcharge.units, surchargeAmount:totals.surcharge.amount,
    total:totals.total
  }};
}

function submitOrder(){
  var result = buildOrderPayload();
  if (result.error){ state.submitError = result.error; render(); return; }
  state.submitError = '';
  var btn = document.getElementById('submit-btn');
  if (btn){ btn.disabled = true; btn.textContent = '저장 중...'; }

  var editing = state.editing;
  var newId = editing ? editing.orderId : genId('ORD');

  mutateOrders(function(orders){
    if (editing){
      return orders.map(function(o){ return o.id===editing.orderId ? Object.assign({}, o, result.payload) : o; });
    }
    var newOrder = Object.assign({ id:newId, createdAt:new Date().toISOString(), status:'접수' }, result.payload);
    return orders.concat([newOrder]);
  }).then(function(){
    if (editing){
      state.editing = null;
      state.draft = makeEmptyDraft();
      state.formFields = { phone:'', date: addDays(todayStr(),3), memo:'', receiveMethod:'', storeName:'', address:'' };
      state.tab = editing.returnTab || 'lookup';
      if (state.tab==='admin'){ state.admin.banner = '주문이 수정되었습니다.'; }
      if (state.tab==='lookup'){ doLookup(); }
      render();
    } else {
      state.confirmation = Object.assign({id:newId}, result.payload);
      state.draft = makeEmptyDraft();
      render();
    }
  });
}

/* ============================================================
   주문조회

function doLookup(){
  var phone = (val('#lookup-phone')||state.lookup.phone).trim();
  state.lookup.phone = phone;
  if (!phone){ state.lookup.searched=false; state.lookup.results=[]; render(); return; }
  loadOrders().then(function(orders){
    state.orders = orders;
    var digits = phone.replace(/[^0-9]/g,'');
    var results = orders.filter(function(o){ return o.phone.replace(/[^0-9]/g,'')===digits; });
    results.sort(function(a,b){ return b.createdAt.localeCompare(a.createdAt); });
    state.lookup.searched = true;
    state.lookup.results = results;
    render();
  });
}

function startEditOrder(orderId, returnTab){
  var order = state.orders.find(function(o){ return o.id===orderId; });
  if (!order) return;
  var draft = makeEmptyDraft();
  draft.items = order.items.map(function(i){ return {productId:i.productId, unit:i.unit, qty:i.qty, cut:i.cut||''}; });
  order.ritual.forEach(function(r){
    var it = draft.ritual.find(function(x){ return x.id===r.id; });
    if (it){ it.sets = r.sets; }
  });
  state.draft = draft;
  state.formFields = { phone:order.phone, date:order.deliveryDate, memo:order.memo||'', receiveMethod:order.receiveMethod||'', storeName:order.storeName||'', address:order.address||'' };
  state.editing = { orderId: order.id, returnTab: returnTab || 'lookup' };
  state.confirmation = null;
  state.submitError = '';
  state.tab = 'order';
  render();
}

function cancelMyOrder(orderId){

}

    state.config = newCfg;
    sf.staffPinNew=''; sf.staffPinConfirm='';
    sf.pinMsg='직원용 PIN이 변경되었습니다.'; sf.pinMsgType='ok';
    render();
  });
}
function addStore(){
  var sf = state.admin.settingsForm;
  var name = val('#set-store-name').trim();
  var addr = val('#set-store-addr').trim();
  if (!name){ sf.storeMsg='매장명을 입력해주세요.'; sf.storeMsgType='error'; render(); return; }
  if (state.stores.some(function(s){ return s.name===name; })){ sf.storeMsg='이미 등록된 매장명입니다.'; sf.storeMsgType='error'; render(); return; }
  mutateStores(function(list){ return list.concat([{id:genId('ST'), name:name, address:addr}]); }).then(function(){
    sf.newStoreName=''; sf.newStoreAddr='';
    sf.storeMsg='매장이 추가되었습니다.'; sf.storeMsgType='ok';
    render();
  });
}
function deleteStore(id){
  mutateStores(function(list){ return list.filter(function(s){ return s.id!==id; }); }).then(function(){ render(); });
}

/* ============================================================
   이벤트 위임
   ============================================================ */
document.addEventListener('DOMContentLoaded', function(){
  var app = document.getElementById('app');

  app.addEventListener('click', function(e){
    var btn = e.target.closest('[data-action]');
    if (!btn) return;
    var action = btn.getAttribute('data-action');
    var id = btn.getAttribute('data-id');

    switch(action){
      case 'go-tab': {
        var tab = btn.getAttribute('data-tab');
        state.tab = tab;
        state.submitError = '';
        if (tab==='admin' && state.admin.unlocked){ loadOrders().then(function(o){ state.orders=o; render(); }); return; }
        if (tab==='monitor' && state.monitor.unlocked){ loadOrders().then(function(o){ state.orders=o; render(); }); return; }
        render();
        break;
      }
      case 'pick-receive': {
        var method = btn.getAttribute('data-method');
        state.formFields.receiveMethod = method;
        state.formFields.storeName=''; state.formFields.address='';
        document.querySelectorAll('.method-btn').forEach(function(b){ b.classList.remove('active'); });
        btn.classList.add('active');
        document.getElementById('receive-detail').innerHTML = renderReceiveDetail();
        break;
      }
      case 'add-cart-line': {
        var picker = state.draft.picker;
        var product = findProduct(Number(picker.productId));
        state.draft.items.push({ productId:product.id, unit:picker.unit, qty:Math.max(1,picker.qty||1), cut:picker.cut||'' });
        state.draft.picker = { productId:'', unit:'', qty:1, cut:'' };
        document.getElementById('picker-panel').innerHTML = renderPickerPanel();
        document.getElementById('cart-list').innerHTML = renderCartList();
        updateGrandTotal();
        break;
      }
      case 'remove-cart-line': {
        var idx = Number(btn.getAttribute('data-idx'));
        state.draft.items.splice(idx,1);
        document.getElementById('cart-list').innerHTML = renderCartList();
        updateGrandTotal();
        break;
      }
      case 'inc-ritual': case 'dec-ritual': {
        var rItem = state.draft.ritual.find(function(r){ return r.id===id; });
        var d = action.indexOf('inc')>-1 ? 1 : -1;
        rItem.sets = Math.max(0, (rItem.sets||0)+d);
        var rInput = document.querySelector('input[data-field="rsets"][data-id="'+id+'"]');
        if (rInput) rInput.value = rItem.sets;
        updateRitualSub(id);
        updateGrandTotal();
        break;
      }
      case 'reset-order': {
        state.draft = makeEmptyDraft();
        state.formFields = { phone:'', date: addDays(todayStr(),3), memo:'', receiveMethod:'', storeName:'', address:'' };
        state.submitError = '';
        render();
        break;
      }
      case 'submit-order': { submitOrder(); break; }
      case 'new-order': {
        state.confirmation = null;
        state.draft = makeEmptyDraft();
        state.formFields = { phone:'', date: addDays(todayStr(),3), memo:'', receiveMethod:'', storeName:'', address:'' };
        render();
        break;
      }
      case 'cancel-edit': {
        var back = state.editing ? state.editing.returnTab : 'lookup';
        state.editing = null;
        state.draft = makeEmptyDraft();
        state.formFields = { phone:'', date: addDays(todayStr(),3), memo:'', receiveMethod:'', storeName:'', address:'' };
        state.tab = back;
        render();
        break;
      }
      case 'do-lookup': { doLookup(); break; }
      case 'edit-order': { startEditOrder(id, btn.getAttribute('data-return')||'lookup'); break; }
      case 'cancel-my-order': { cancelMyOrder(id); break; }

      case 'admin-unlock': { adminUnlock(); break; }
      case 'admin-date-prev': { state.admin.date = addDays(state.admin.date,-1); render(); break; }
      case 'admin-date-next': { state.admin.date = addDays(state.admin.date,1); render(); break; }
      case 'admin-date-today': { state.admin.date = addDays(todayStr(),1); render(); break; }
      case 'admin-refresh': { loadOrders().then(function(o){ state.orders=o; state.admin.banner=''; render(); }); break; }
      case 'admin-print': { window.print(); break; }
      case 'admin-open-settings': { state.admin.view='settings'; render(); break; }
      case 'admin-back-dashboard': { state.admin.view='dashboard'; render(); break; }
      case 'admin-delete': { state.admin.deleteConfirmId = id; render(); break; }
      case 'admin-delete-cancel': { state.admin.deleteConfirmId = null; render(); break; }
      case 'admin-delete-confirm': { deleteOrder(id); break; }
      case 'save-admin-pin': { saveAdminPin(); break; }
      case 'save-staff-pin': { saveStaffPin(); break; }
      case 'add-store': { addStore(); break; }
      case 'delete-store': { deleteStore(id); break; }

      case 'monitor-unlock': { monitorUnlock(); break; }
      case 'monitor-refresh': { loadOrders().then(function(o){ state.orders=o; render(); }); break; }
      case 'monitor-print': { window.print(); break; }
    }
  });

  app.addEventListener('input', function(e){
    var t = e.target;
    if (t.id==='pick-qty'){
      var num = parseInt(t.value,10);
      state.draft.picker.qty = isNaN(num) ? 0 : Math.max(0,num);
      refreshPickerAddButton();
    } else if (t.matches('input[data-field="rsets"]')){
      var rid = t.getAttribute('data-id');
      var rItem2 = state.draft.ritual.find(function(r){ return r.id===rid; });
      var num2 = parseInt(t.value,10);
      rItem2.sets = isNaN(num2) ? 0 : Math.max(0,num2);
      updateRitualSub(rid);
      updateGrandTotal();
    } else if (t.id==='f-phone'){
      state.formFields.phone = t.value;
    } else if (t.id==='f-memo'){
      state.formFields.memo = t.value;
    } else if (t.id==='f-date'){
      state.formFields.date = t.value;
      renderDateNotice();
    } else if (t.id==='f-store-search'){
      state.formFields.storeName = t.value;
    } else if (t.id==='f-address'){
      state.formFields.address = t.value;
    } else if (t.id==='admin-date'){
      state.admin.date = t.value; render();
    } else if (t.id==='admin-pin'){
      state.admin.pinInput = t.value;
    } else if (t.id==='monitor-pin'){
      state.monitor.pinInput = t.value;
    } else if (t.id==='lookup-phone'){
      state.lookup.phone = t.value;
    } else if (t.id==='set-admin-pin-new'){
      state.admin.settingsForm.adminPinNew = t.value;
    } else if (t.id==='set-admin-pin-confirm'){
      state.admin.settingsForm.adminPinConfirm = t.value;
    } else if (t.id==='set-staff-pin-new'){
      state.admin.settingsForm.staffPinNew = t.value;
    } else if (t.id==='set-staff-pin-confirm'){
      state.admin.settingsForm.staffPinConfirm = t.value;
    } else if (t.id==='set-store-name'){
      state.admin.settingsForm.newStoreName = t.value;
    } else if (t.id==='set-store-addr'){
      state.admin.settingsForm.newStoreAddr = t.value;
    }
  });

  app.addEventListener('change', function(e){
    var t = e.target;
    if (t.id==='pick-product'){
      state.draft.picker = { productId:t.value, unit:'', qty:1, cut:'' };
      document.getElementById('picker-panel').innerHTML = renderPickerPanel();
    } else if (t.id==='pick-unit'){
      state.draft.picker.unit = t.value;
      state.draft.picker.qty = state.draft.picker.qty || 1;
      document.getElementById('picker-panel').innerHTML = renderPickerPanel();
    } else if (t.id==='pick-cut'){
      state.draft.picker.cut = t.value;
      refreshPickerAddButton();
    } else if (t.matches('select[data-action-select="status"]')){
      changeOrderStatus(t.getAttribute('data-id'), t.value);
    }
  });

  app.addEventListener('keydown', function(e){
    if (e.key==='Enter' && e.target && e.target.id==='admin-pin'){ adminUnlock(); }
    if (e.key==='Enter' && e.target && e.target.id==='monitor-pin'){ monitorUnlock(); }
    if (e.key==='Enter' && e.target && e.target.id==='lookup-phone'){ doLookup(); }
  });

  /* 초기 로드 */
  render();
  Promise.all([loadOrders(), loadConfig(), loadStores()]).then(function(res){
    state.orders = res[0];
    state.config = res[1];
    state.stores = res[2];
  });
});
})();
</script>
</body>
</html>
